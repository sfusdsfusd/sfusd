<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#14161a;--fg:#f2f2f2;--acc:#ff4d4d;--panel:rgba(0,0,0,.55)}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;inset:0;pointer-events:none}
#cross{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px}
#cross:before,#cross:after{content:"";position:absolute;background:#fff;opacity:.9}
#cross:before{left:8px;top:0;width:2px;height:18px}#cross:after{top:8px;left:0;height:2px;width:18px}
.box{position:absolute;background:var(--panel);padding:8px 14px;border-radius:8px;font-weight:700;font-size:18px}
#ammo{right:16px;bottom:110px}#hp{left:16px;bottom:16px;padding:0;background:none;border-radius:0}#score{left:16px;top:16px}
#slots{position:absolute;right:16px;bottom:16px;display:flex;gap:6px;pointer-events:auto}
.slot{position:relative;background:var(--panel);border:2px solid transparent;border-radius:8px;padding:4px;width:68px;height:68px;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center}
.slot img{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none}
.slot b{position:absolute;left:4px;top:2px;font-size:12px}.slot i{position:absolute;right:4px;bottom:2px;font-size:12px;font-style:normal;font-weight:700}
.slot.on{border-color:#fff;background:rgba(255,77,77,.6)}
#hpbar{position:relative;width:244px;height:31px;box-sizing:border-box;background:#5f2e12;border:3px solid #1b0d05;border-radius:9px;overflow:hidden}
#hpfill{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(#5fd93a,#43b523);transition:width .15s}
#hpnum{position:absolute;right:8px;top:0;bottom:0;display:flex;align-items:center;font-weight:800;font-size:15px;color:#fff;text-shadow:0 1px 3px #000;z-index:1}
#keys{position:absolute;right:16px;top:16px;background:var(--panel);border-radius:8px;padding:8px 12px;font-size:13px}
#keys h3{margin:0 0 6px;font-size:14px;text-align:center;letter-spacing:1px}
#keys table{border-collapse:collapse}
#keys td{padding:2px 0}#keys td:first-child{padding-right:14px}
#keys kbd{display:inline-block;min-width:34px;text-align:center;font:700 12px system-ui,sans-serif;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);border-radius:4px;padding:1px 6px}

 var bar=new THREE.Mesh(new THREE.BoxGeometry(1,.1,.03),new THREE.MeshBasicMaterial({color:0x33ff55}));bar.position.set(0,sz+.3,0);g.add(bar);
 g.userData={npc:1,id:++nid,hp:max,max:max,bar:bar,type:type,fl:0,r:sz*.6+.3};return g;}

 var g=makeNpc(kills>=10?2:1);g.position.set(x,0,z);scene.add(g);npcs.push(g);}

 sdx=-Math.sin(yaw)*f+Math.cos(yaw)*s;sdz=-Math.cos(yaw)*f-Math.sin(yaw)*s;slideT=SLIDE;slideCd=SLIDE+.5;beep(140,.3,'triangle');}

function damage(n,d){var u=n.userData;if(G){send({t:'h',id:u.id,d:d});u.fl=.1;tint(n,0x661111);return;}u.hp-=d;u.bar.scale.x=Math.max(.001,u.hp/u.max);u.fl=.1;tint(n,0x661111);
 if(u.hp<=0){scene.remove(n);var i=npcs.indexOf(n);if(i>=0)npcs.splice(i,1);kills++;beep(300,.12,'sawtooth');
  if(kills%10===0)dropPack();if(kills%5===0)dropAmmo();if(!npcs.length)waveT=3;ui();}}
function pkPos(g,x,z){if(x===undefined){var a=Math.random()*6.28,r=3+Math.random()*4;x=Math.max(-ARENA+2,Math.min(ARENA-2,P.x+Math.cos(a)*r));z=Math.max(-ARENA+2,Math.min(ARENA-2,P.z+Math.sin(a)*r));}g.position.set(x,1,z);scene.add(g);packs.push(g);}
function dropPack(x,z,id){var g=new THREE.Group(),m={color:0x22dd44,emissive:0x0a8a2a};
  [[1,.3,.3],[.3,1,.3],[.3,.3,1]].forEach(function(s){g.add(new THREE.Mesh(new THREE.BoxGeometry(s[0],s[1],s[2]),new THREE.MeshLambertMaterial(m)))});
  g.userData={id:id||++nid};pkPos(g,x,z);}
function dropAmmo(x,z,id){var g=new THREE.Group(),brass={color:0xffcc22,emissive:0x8a6a0a},tip={color:0xdddddd,emissive:0x444444};
  [-.3,0,.3].forEach(function(x){var b=new THREE.Mesh(new THREE.CylinderGeometry(.11,.11,.5,10),new THREE.MeshLambertMaterial(brass));b.position.x=x;g.add(b);
   var t=new THREE.Mesh(new THREE.ConeGeometry(.11,.22,10),new THREE.MeshLambertMaterial(tip));t.position.set(x,.36,0);g.add(t);});
  g.userData={ammo:1,id:id||++nid};pkPos(g,x,z);}

function hitscan(d){cam.updateMatrixWorld();raycaster.setFromCamera({x:0,y:0},cam);var h=raycaster.intersectObjects(npcs,true);
 if(h.length){var o=h[0].object;while(o&&!o.userData.npc)o=o.parent;if(o)damage(o,d);}}
function punchHit(){pside^=1;var fx=-Math.sin(yaw),fz=-Math.cos(yaw),best=null,bd=9;
 npcs.forEach(function(n){var dx=n.position.x-P.x,dz=n.position.z-P.z,d=Math.hypot(dx,dz);if(d<2.8&&(dx*fx+dz*fz)/d>.5&&d<bd){bd=d;best=n}});
 if(best)damage(best,75);beep(best?120:200,.1,'triangle');}

function releaseG(){var dir=new THREE.Vector3();cam.getWorldDirection(dir);var m=new THREE.Mesh(new THREE.SphereGeometry(.15),new THREE.MeshLambertMaterial({color:0x3a6a2a}));
 m.position.copy(cam.position).addScaledVector(dir,.6);scene.add(m);gs.push({m:m,v:dir.multiplyScalar(16).add(new THREE.Vector3(0,3,0)),t:.3});}
function boom(p){var m=new THREE.Mesh(new THREE.SphereGeometry(1,16,12),new THREE.MeshBasicMaterial({color:0xff9933,transparent:true,opacity:.7}));m.position.copy(p);scene.add(m);booms.push({m:m,t:0});
 npcs.slice().forEach(function(n){var c=n.position.clone();c.y=1;if(c.distanceTo(p)<5)damage(n,135)});beep(70,.4,'sawtooth');}
function fire(){if(!running)return;var w=W[cur];
 if(cur<2){if(w.rel>0||w.cd>0)return;if(w.ammo<=0){reload();return}w.ammo--;w.cd=w.rate;recoil=1;flash.intensity=2;setTimeout(function(){flash.intensity=0},50);beep(cur?220:180,.08);hitscan(w.dmg);if(w.ammo<=0)reload();ui();}
 else if(cur===2){if(w.cd>0)return;w.cd=w.rate;punch=1;punchHit();}
 else if(gren<=0)throwG();}

 var s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthTest:false,depthWrite:false,fog:false}));
